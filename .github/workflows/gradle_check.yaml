name: gradle check

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: gradlew build
        run: ./gradlew build
      - name: gradlew changelogPrint
        run: ./gradlew changelogPrint
